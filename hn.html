<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orange Dumbo — Hacker News Top 100 filtered</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f6f6ef; color: #333; }
header { background: #ff6600; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 18px; color: #fff; }
header .subtitle { font-size: 13px; color: rgba(255,255,255,0.8); }
#yuck-btn {
  margin-left: auto;
  padding: 6px 16px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  background: #c00;
  border-radius: 4px;
  letter-spacing: 0.5px;
  transition: background 0.15s;
}
#yuck-btn.yuck { background: #c00; }
#yuck-btn.serenity { background: #1a7f37; }
#status { font-size: 13px; color: #828282; padding: 8px 20px; }
#stories { max-width: 900px; margin: 0 auto; padding: 0 20px 40px; }
.story { display: grid; grid-template-columns: 36px 60px 1fr; gap: 0 10px; padding: 6px 0; border-bottom: 1px solid #e8e8e8; align-items: baseline; }
.rank { color: #828282; font-size: 13px; text-align: right; }
.score { color: #ff6600; font-size: 13px; font-weight: 600; text-align: right; }
.story-main { min-width: 0; }
.story-title a { color: #000; text-decoration: none; font-size: 14px; }
.story-title a:hover { text-decoration: underline; }
.story-title a:visited { color: #828282; }
.story-meta { font-size: 12px; color: #828282; margin-top: 2px; }
.story-meta a { color: #828282; text-decoration: none; }
.story-meta a:hover { text-decoration: underline; }
.hn-link { color: #ff6600 !important; }
.loading { text-align: center; padding: 40px; color: #828282; }
.error { text-align: center; padding: 40px; color: #c00; }

/* === Yuck mode: filtered-out stories — menacing & sinister === */
.story.yuck {
  background: linear-gradient(90deg, #1a0000, #2a0008, #1a0000);
  border-bottom: 1px solid #3a0000;
  padding: 8px 10px;
  margin: 4px 0;
  border-radius: 2px;
  animation: yuck-pulse 2.4s ease-in-out infinite;
}
.story.yuck .rank {
  color: #ff3333;
  font-weight: 700;
  text-shadow: 0 0 6px #ff0000, 0 0 2px #ff0000;
  transform: scaleY(1.3);
}
.story.yuck .score {
  color: #ff4444;
  text-shadow: 0 0 5px #cc0000;
  font-style: italic;
}
.story.yuck .story-title a {
  color: #ff1a1a;
  font-family: "Courier New", monospace;
  letter-spacing: 1.2px;
  text-shadow: 1px 1px 0 #000, 0 0 8px #660000;
  text-decoration: line-through;
  text-decoration-color: #cc0000;
  text-decoration-thickness: 2px;
}
.story.yuck .story-title a:hover {
  color: #ff6666;
  text-shadow: 0 0 12px #ff0000, 1px 1px 0 #000;
  letter-spacing: 2px;
}
.story.yuck .story-meta {
  color: #8a2a2a;
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.5px;
}
.story.yuck .story-meta a {
  color: #aa3333;
}
.story.yuck .hn-link {
  color: #ff3333 !important;
  text-shadow: 0 0 4px #660000;
}
@keyframes yuck-pulse {
  0%, 100% { box-shadow: inset 0 0 0 0 rgba(204,0,0,0); }
  50% { box-shadow: inset 3px 0 0 0 #cc0000, inset -3px 0 0 0 #cc0000; }
}
#stories.yuck-mode {
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 20px,
    rgba(102,0,0,0.03) 20px,
    rgba(102,0,0,0.03) 40px
  );
}
</style>
</head>
<body>
<header>
  <h1>Orange Dumbo</h1>
  <span class="subtitle">Hacker News Top 100 with some personal filters applied... (so it is not actual 100)</span>
  <button id="yuck-btn" class="yuck">Yuck!</button>
</header>
<div id="status">Loading stories...</div>
<div id="stories"></div>

<script>
const API = "https://hacker-news.firebaseio.com/v0";

const FILTER_KEYWORDS = ["llm", "openai", "codex", "claude", "anthropic", "token", "agent", "genai", "zig", "rust", "mythos", "sonnet", "gpt", "opus", "fable", "zed", "a.i.", "gemma", "glm", "kimi", "karpathy", "altman", "grok", "amodei"];
const FILTER_PATTERNS = [/\bvibecod/i, /\bvibe[-\s]?cod/i, /\bAI\b/];
const FILTER_DOMAINS = ["anthropic.com", "openai.com", "simonwillison.net", "zed.dev"];
const LINUX_KEYWORDS = ["linux", "ubuntu", "debian", "fedora", "gentoo", "kernel", "bsd", "redhat"];
const AI_KEYWORDS = ["llm", "openai", "codex", "claude", "anthropic", "token", "agent", "genai", "sonnet", "gpt", "opus"];

function isLinuxAICombo(title) {
  const lower = title.toLowerCase();
  const hasLinux = LINUX_KEYWORDS.some(kw => lower.includes(kw));
  const hasAI = AI_KEYWORDS.some(kw => lower.includes(kw)) || FILTER_PATTERNS.some(p => p.test(title));
  return hasLinux && hasAI;
}

function isFiltered(item) {
  const title = item.title ?? "";
  if (isLinuxAICombo(title)) return false;
  if (FILTER_KEYWORDS.some(kw => title.toLowerCase().includes(kw))) return true;
  if (FILTER_PATTERNS.some(p => p.test(title))) return true;
  const domain = domainFrom(item.url || "");
  if (domain && FILTER_DOMAINS.includes(domain)) return true;
  return false;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

let allItems = [];
let showYuck = false;

async function loadStories() {
  const statusEl = document.getElementById("status");
  const container = document.getElementById("stories");
  statusEl.textContent = "Loading stories...";

  try {
    const ids = await fetchJSON(`${API}/topstories.json`);
    const top100 = ids.slice(0, 100);

    allItems = await Promise.all(
      top100.map(id => fetchJSON(`${API}/item/${id}.json`).catch(() => null))
    );

    render();
  } catch (err) {
    statusEl.textContent = "";
    container.innerHTML = `<div class="error">Failed to load stories: ${err.message}</div>`;
  }
}

function render() {
  const statusEl = document.getElementById("status");
  const container = document.getElementById("stories");
  const valid = allItems.filter(Boolean);

  if (showYuck) {
    const yuckItems = valid.filter(i => isFiltered(i));
    statusEl.textContent = `Showing ${yuckItems.length} filtered-out abominations · ${valid.length - yuckItems.length} spared · fetched at ${new Date().toLocaleTimeString()}`;
    container.className = "yuck-mode";
    container.innerHTML = "";
    yuckItems.forEach((item, i) => {
      container.appendChild(buildStoryEl(item, i + 1, true));
    });
  } else {
    const shown = valid.filter(i => !isFiltered(i)).length;
    statusEl.textContent = `Showing ${shown} of ${valid.length} stories · fetched at ${new Date().toLocaleTimeString()}`;
    container.className = "";
    container.innerHTML = "";
    let rank = 0;
    valid.forEach((item) => {
      if (isFiltered(item)) return;
      rank++;
      container.appendChild(buildStoryEl(item, rank, false));
    });
  }
}

function buildStoryEl(item, rank, yuck) {
  const score = item.score ?? 0;
  const title = item.title ?? "(no title)";
  const by = item.by ?? "unknown";
  const descendants = item.descendants ?? 0;
  const url = item.url;

  const storyURL = url || `https://news.ycombinator.com/item?id=${item.id}`;
  const commentsURL = `https://news.ycombinator.com/item?id=${item.id}`;
  const isSelf = !url;

  const div = document.createElement("div");
  div.className = yuck ? "story yuck" : "story";
  div.innerHTML = `
    <span class="rank">${rank}.</span>
    <span class="score">${score}pt</span>
    <div class="story-main">
      <div class="story-title">
        <a href="${escapeAttr(storyURL)}" ${!isSelf ? 'target="_blank" rel="noopener"' : ""}>${escapeHTML(title)}</a>
        ${!isSelf ? `<span class="story-meta">(${domainFrom(url)})</span>` : ""}
      </div>
      <div class="story-meta">
        by <a href="https://news.ycombinator.com/user?id=${escapeAttr(by)}">${escapeHTML(by)}</a> ·
        <a class="hn-link" href="${commentsURL}" target="_blank" rel="noopener">${descendants} comments</a>
      </div>
    </div>
  `;
  return div;
}

function toggleYuck() {
  const btn = document.getElementById("yuck-btn");
  showYuck = !showYuck;
  if (showYuck) {
    btn.textContent = "Serenity now";
    btn.className = "serenity";
  } else {
    btn.textContent = "Yuck!";
    btn.className = "yuck";
  }
  render();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("yuck-btn").addEventListener("click", toggleYuck);
});

function domainFrom(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch { return ""; }
}

function escapeHTML(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function escapeAttr(s) {
  return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadStories();
</script>
</body>
</html>
